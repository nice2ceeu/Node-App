<!doctype html>
<html lang="en">
	<head>
		<link rel="icon" href="images/logo.png" type="image/png">
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link
			rel="stylesheet"
			href="login_register.css"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
		<title>Welcome to Citaw</title>
	</head>
	<body>
		<header>
			<img src="images/logo.png" alt="CITAW logo" />
			<h1>CITAW</h1>
		</header>

		<section class="login_page_layout">
			<aside class="carouselContainer">
				<img src="images/logo.png" alt="Fresh products from CITAW" />
				<div class="visual-copy"><span>Welcome to CITAW</span><strong>Everyday favorites,<br>thoughtfully picked.</strong></div>
			</aside>
			<main class="loginContainer">
				<div class="loginForm">
					<p class="form-kicker">Welcome back</p>
					<h1>Login</h1>
					<input
                
						type="email"
                        id="email"
						placeholder="Email address"
						autocomplete="email"
                        required
					/>
					<input
                    
						type="password"
                        id="password"
						placeholder="Enter your password"
						autocomplete="current-password"
                        required
					/>
					<button class="loginButton" id="login">Login</button>

					<a class="forgot" href="#">Forgot password?</a>
					<a
						class="registerButton"
						href="register.html"
						>Create new Account</a
					>
                </div>
			</main>
		</section>
		<footer>
			<p>&copy; 2024 CITAW. All rights reserved.</p>
		</footer>
        <script src="index.js"></script>
	</body>
</html>
